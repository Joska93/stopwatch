<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sea Route Stopwatch</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  :root {
    --bg:#040b16; --panel:#081325; --panel-2:#0b1a30; --line:#14253d; --line-2:#1d3352;
    --cyan:#38e1ff; --cyan-dim:rgba(56,225,255,.14); --amber:#ffb547; --amber-dim:rgba(255,181,71,.14);
    --text:#e7eef8; --muted:#7b8ba3; --land:#1f3a5a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(1200px 600px at 70% -10%, #0b2142 0%, var(--bg) 60%); color:var(--text);
         font-family:"Pretendard","Segoe UI","Malgun Gothic",sans-serif; min-height:100vh; padding:28px 16px 40px;
         display:flex; justify-content:center; }
  .mono { font-family:"JetBrains Mono",Consolas,"SF Mono",monospace; font-variant-numeric:tabular-nums; }
  .app { width:100%; max-width:1040px; }

  header { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .title { display:flex; align-items:center; gap:12px; }
  .title svg { flex:none; }
  h1 { font-size:17px; letter-spacing:2.5px; font-weight:800; }
  .title p { font-size:12px; color:var(--muted); margin-top:2px; }
  .route-chip { font-size:11px; color:var(--cyan); border:1px solid var(--line-2); background:var(--cyan-dim);
                padding:6px 12px; border-radius:99px; letter-spacing:.5px; }

  /* 지도 */
  .map { position:relative; background:linear-gradient(180deg,#071427,#06101f); border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .map canvas, .map svg.ov { display:block; width:100%; height:auto; }
  .map svg.ov { position:absolute; inset:0; }
  .hud { position:absolute; bottom:14px; left:14px; background:rgba(6,16,31,.78); backdrop-filter:blur(6px);
         border:1px solid var(--line-2); border-radius:14px; padding:12px 14px; min-width:200px; }
  .hud .k { font-size:10px; color:var(--muted); letter-spacing:1px; }
  .hud .region { font-size:18px; font-weight:800; margin:2px 0 8px; }
  .hud .row { display:flex; justify-content:space-between; gap:14px; font-size:11px; color:var(--muted); }
  .hud .row b { color:var(--text); font-weight:600; }
  .scale { position:absolute; top:14px; right:14px; font-size:10px; color:var(--muted); text-align:right; line-height:1.6;
           background:rgba(6,16,31,.6); border:1px solid var(--line); border-radius:10px; padding:6px 10px; }
  .scale b { color:var(--cyan); }
  .toast { position:absolute; top:16px; left:50%; transform:translate(-50%,-12px); opacity:0; pointer-events:none;
           background:rgba(255,181,71,.12); border:1px solid rgba(255,181,71,.5); color:var(--amber); backdrop-filter:blur(6px);
           font-size:13px; font-weight:700; padding:8px 16px; border-radius:99px; transition:opacity .35s, transform .35s; white-space:nowrap; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .maperr { position:absolute; inset:auto 0 12px 0; text-align:center; font-size:11px; color:var(--muted); }

  /* 항해 진행 바 */
  .voyage { position:relative; margin:18px 10px 6px; height:44px; }
  .voyage .track { position:absolute; top:8px; left:0; right:0; height:4px; border-radius:2px; background:var(--line-2); }
  .voyage .fill { position:absolute; top:8px; left:0; height:4px; border-radius:2px; background:linear-gradient(90deg,#1aa6c9,var(--cyan)); box-shadow:0 0 12px var(--cyan); }
  .voyage .port { position:absolute; top:3px; transform:translateX(-50%); text-align:center; }
  .voyage .port i { display:block; width:14px; height:14px; margin:0 auto; border-radius:50%; background:var(--bg); border:2px solid var(--line-2); transition:.3s; }
  .voyage .port.on i { border-color:var(--amber); background:var(--amber); box-shadow:0 0 10px var(--amber); }
  .voyage .port span { display:block; font-size:10px; color:var(--muted); margin-top:5px; white-space:nowrap; }
  .voyage .port.on span { color:var(--amber); }
  .voyage .port:first-child { transform:none; text-align:left; } .voyage .port:first-child i { margin:0; }
  .voyage .port:last-child { transform:translateX(-100%); text-align:right; } .voyage .port:last-child i { margin:0 0 0 auto; }

  /* 패널 */
  .panel { display:grid; grid-template-columns:1.05fr 1fr; gap:16px; margin-top:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:20px 22px; }
  .card .k { font-size:11px; color:var(--muted); letter-spacing:1px; }
  .time-row { display:flex; justify-content:space-between; align-items:flex-start; }
  .state { font-size:11px; font-weight:700; padding:5px 10px; border-radius:99px; background:var(--panel-2); color:var(--muted); display:inline-flex; gap:6px; align-items:center; }
  .state i { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .state.live { color:var(--cyan); background:var(--cyan-dim); } .state.live i { animation:blink 1.2s infinite; }
  .state.hold { color:var(--amber); background:var(--amber-dim); }
  @keyframes blink { 50% { opacity:.25; } }
  .time { font-size:clamp(46px,9vw,64px); font-weight:700; letter-spacing:-1.5px; line-height:1.1; margin:4px 0 16px; }
  .time small { font-size:.48em; color:var(--muted); font-weight:500; letter-spacing:0; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  .stat { background:var(--panel-2); border-radius:12px; padding:9px 11px; }
  .stat span { display:block; font-size:10px; color:var(--muted); }
  .stat b { display:block; font-size:15px; margin-top:2px; }
  .controls { display:grid; grid-template-columns:1.5fr 1.2fr .9fr; gap:8px; }
  button { height:52px; border-radius:14px; border:1px solid var(--line-2); background:transparent; color:var(--text);
           font:inherit; font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap; transition:transform .08s, opacity .2s; }
  button:active:not(:disabled) { transform:scale(.97); }
  button:focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
  button:disabled { opacity:.3; cursor:default; }
  button.primary { background:var(--cyan); border-color:var(--cyan); color:#03111f; }
  button.primary.hold { background:var(--amber); border-color:var(--amber); }
  .keys { margin-top:14px; font-size:11px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
  kbd { font-family:inherit; font-size:10px; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:5px; padding:1px 5px; margin-right:3px; }

  .log-head { display:flex; justify-content:space-between; margin-bottom:8px; }
  ol { list-style:none; max-height:250px; overflow:auto; }
  li { display:grid; grid-template-columns:30px 1fr auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:none; }
  .no { width:26px; height:26px; border-radius:8px; background:var(--amber-dim); color:var(--amber); display:grid; place-items:center; font-size:11px; font-weight:800; }
  li .reg { font-size:14px; font-weight:700; } li .pos { font-size:11px; color:var(--muted); margin-top:2px; }
  li .tm { text-align:right; font-size:13px; font-weight:600; } li .tm small { display:block; font-size:10px; color:var(--muted); font-weight:400; }
  li.port-ev .no { background:var(--cyan-dim); color:var(--cyan); }
  li.port-ev .reg { color:var(--cyan); }
  .empty { display:block; text-align:center; color:var(--muted); font-size:13px; padding:28px 0; border:none; }

  @media (max-width:760px) {
    .panel { grid-template-columns:1fr; }
    .hud { position:static; margin:0; border-radius:0; border:none; border-top:1px solid var(--line); background:var(--panel); backdrop-filter:none; }
    .scale { display:none; }
    .ov .en { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="16" fill="none" stroke="#38e1ff" stroke-opacity=".35"/>
        <path d="M2 17h30M17 1c-5 5-5 27 0 32M17 1c5 5 5 27 0 32" fill="none" stroke="#38e1ff" stroke-opacity=".35"/>
        <path d="M9 21l2.5 3h11l2.5-3z" fill="#38e1ff"/><path d="M12 21v-4h10v4" fill="none" stroke="#38e1ff" stroke-width="1.5"/>
      </svg>
      <div><h1>SEA ROUTE STOPWATCH</h1><p>시간이 흐르는 만큼, 배는 바다를 건넙니다</p></div>
    </div>
    <span class="route-chip mono">ASIA–EUROPE · BUSAN → ROTTERDAM via SUEZ</span>
  </header>

  <div class="map" id="map" role="img" aria-label="부산에서 싱가포르, 수에즈 운하를 거쳐 로테르담까지 가는 해상 항로 지도. 스탑워치가 흐르면 선박이 항로를 따라 이동합니다.">
    <canvas id="land"></canvas>
    <svg class="ov" id="ov" viewBox="0 0 960 440" aria-hidden="true"></svg>
    <div class="hud" aria-live="polite">
      <div class="k">현재 해역</div>
      <div class="region" id="hReg">부산항 정박 중</div>
      <div class="row"><span>위치</span><b class="mono" id="hPos">N 35°04.8' E 129°02.4'</b></div>
      <div class="row"><span>침로</span><b class="mono" id="hHdg">—</b></div>
    </div>
    <div class="scale mono">1 min = <b>1 voyage</b><br><span id="totalNm"></span></div>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <div class="voyage" id="voyage"><div class="track"></div><div class="fill" id="fill" style="width:0"></div></div>

  <div class="panel">
    <section class="card">
      <div class="time-row">
        <span class="k">항해 시간</span>
        <span class="state" id="state" role="status"><i></i><span id="stateText">출항 대기</span></span>
      </div>
      <div class="time mono" id="time">00:00<small>.00</small></div>
      <div class="stats">
        <div class="stat"><span>항차</span><b class="mono" id="sVoy">#1</b></div>
        <div class="stat"><span>진행률</span><b class="mono" id="sPct">0%</b></div>
        <div class="stat"><span>항해 거리</span><b class="mono" id="sDist">0 nm</b></div>
      </div>
      <div class="controls">
        <button id="startBtn" class="primary" aria-keyshortcuts="Space">출항</button>
        <button id="lapBtn" disabled aria-keyshortcuts="P">위치 보고</button>
        <button id="resetBtn" disabled aria-keyshortcuts="R">초기화</button>
      </div>
      <div class="keys"><span><kbd>Space</kbd>출항/정박</span><span><kbd>P</kbd>위치 보고</span><span><kbd>R</kbd>초기화</span></div>
    </section>
    <section class="card">
      <div class="log-head"><span class="k">위치 보고 로그</span><span class="k mono" id="logCount">0건</span></div>
      <ol id="log"></ol>
    </section>
  </div>
</div>

<script>
  const W=960, H=440, VOY=60000, NM=3440.065;
  const WP=[
    [129.04,35.08,'대한해협'],[125,30.5,'동중국해'],[119.6,24.2,'대만 해협'],[113,15,'남중국해'],[106.5,7.5,'남중국해'],
    [104.3,1.25,'싱가포르 해협'],[101.3,2.6,'말라카 해협'],[96,6,'벵골만 남부'],[86,5.2,'인도양'],[80.5,5.4,'아라비아해'],[52,13.2,'아덴만'],
    [43.4,12.6,'홍해'],[40,17.5,'홍해'],[37.5,22,'홍해'],[34.5,27,'수에즈만'],[32.55,29.9,'수에즈 운하'],
    [32.3,31.35,'동지중해'],[28,33.6,'동지중해'],[22,34.3,'지중해'],[11.6,37.4,'서지중해'],[8,37.7,'서지중해'],[0,37.2,'알보란해'],
    [-5.6,35.95,'지브롤터 해협'],[-9.8,36.8,'북대서양'],[-10.2,43.5,'비스케이만'],[-5.8,48.6,'영국 해협'],
    [-1.5,50.2,'영국 해협'],[1.6,51,'북해'],[4.05,51.98,'로테르담항']
  ];
  const PORTS=[
    {ko:'부산', en:'BUSAN', ll:[129.04,35.08], dx:8, dy:-8},
    {ko:'싱가포르', en:'SINGAPORE', ll:[103.82,1.26], dx:-14, dy:16, anchor:'end'},
    {ko:'수에즈', en:'SUEZ', ll:[32.45,30.4], dx:-8, dy:-10, anchor:'end'},
    {ko:'로테르담', en:'ROTTERDAM', ll:[4.05,51.98], dx:8, dy:-8},
  ];

  const proj=d3.geoEquirectangular().fitExtent([[16,16],[W-16,H-16]],{type:'MultiPoint',coordinates:[[-24,-10],[150,62]]});

  // 항로 보간
  const pts=[]; let cum=0;
  for(let i=0;i<WP.length-1;i++){
    const a=WP[i].slice(0,2), b=WP[i+1].slice(0,2), d=d3.geoDistance(a,b)*NM, n=Math.max(2,Math.ceil(d/30)), f=d3.geoInterpolate(a,b);
    for(let k=(i?1:0);k<=n;k++){ const ll=f(k/n); pts.push({ll, xy:proj(ll), d:cum+d*k/n, reg:WP[i][2]}); }
    cum+=d;
  }
  const TOTAL=cum;
  PORTS.forEach(p=>{ let best=0, bd=1e9; pts.forEach(q=>{ const dd=d3.geoDistance(q.ll,p.ll); if(dd<bd){bd=dd;best=q.d;} }); p.d=best; });
  document.getElementById('totalNm').textContent=Math.round(TOTAL).toLocaleString()+' nm';

  // SVG 레이어
  const svg=d3.select('#ov'), defs=svg.append('defs');
  const glow=defs.append('filter').attr('id','glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  glow.append('feGaussianBlur').attr('stdDeviation',3).attr('result','b');
  const fm=glow.append('feMerge'); fm.append('feMergeNode').attr('in','b'); fm.append('feMergeNode').attr('in','SourceGraphic');
  svg.append('path').attr('d',d3.geoPath(proj)(d3.geoGraticule().step([20,20])())).attr('fill','none').attr('stroke','#38e1ff').attr('stroke-opacity',.05);
  const line=d3.line();
  svg.append('path').attr('d',line(pts.map(p=>p.xy))).attr('fill','none').attr('stroke','#06101f').attr('stroke-opacity',.8).attr('stroke-width',4);
  svg.append('path').attr('d',line(pts.map(p=>p.xy))).attr('fill','none').attr('stroke','#9eeeff').attr('stroke-opacity',.7).attr('stroke-width',1.4).attr('stroke-dasharray','3 4');
  const trail=svg.append('path').attr('fill','none').attr('stroke','#38e1ff').attr('stroke-width',2.2).attr('stroke-linecap','round').attr('filter','url(#glow)');
  const portG=svg.append('g'), pinG=svg.append('g');
  // 화면이 좁아지면 지도 위 표식(항구·선박·핀)을 키워 가독성 유지
  let K=1;
  function calcK(){ const w=document.getElementById('map').clientWidth||W; K=Math.min(2.4,Math.max(1,(W/w)*0.5)); }
  calcK();
  const place=(sel,xy)=>sel.attr('transform',`translate(${xy[0]},${xy[1]}) scale(${K})`);
  PORTS.forEach(p=>{
    const [x,y]=proj(p.ll), g=portG.append('g'); p.g=g; place(g,[x,y]);
    p.ring=g.append('circle').attr('r',7).attr('fill','none').attr('stroke','#ffb547').attr('stroke-opacity',.35);
    p.dot=g.append('circle').attr('r',3.5).attr('fill','#081325').attr('stroke','#ffb547').attr('stroke-width',1.6);
    const t=g.append('text').attr('x',p.dx).attr('y',p.dy).attr('text-anchor',p.anchor||'start').attr('fill','#ffb547');
    t.append('tspan').attr('font-size',12).attr('font-weight',700).text(p.ko);
    t.append('tspan').attr('class','en').attr('dx',4).attr('font-size',9).attr('fill-opacity',.6).text(p.en);
  });
  const shipG=svg.append('g');
  const sonar=shipG.append('circle').attr('r',6).attr('fill','none').attr('stroke','#38e1ff');
  shipG.append('circle').attr('r',9).attr('fill','#38e1ff').attr('fill-opacity',.15);
  const hull=shipG.append('path').attr('d','M9,0 L-6,-5 L-3,0 L-6,5 Z').attr('fill','#e9fbff').attr('stroke','#38e1ff').attr('stroke-width',1);

  // 항해 진행 바 항구 눈금
  const voy=document.getElementById('voyage');
  PORTS.forEach(p=>{ const el=document.createElement('div'); el.className='port'; el.style.left=(p.d/TOTAL*100)+'%';
    el.innerHTML=`<i></i><span>${p.ko}</span>`; voy.appendChild(el); p.tick=el; });

  // 육지 점묘
  const cv=document.getElementById('land'), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(r=>r.json()).then(topo=>{
    const land=topojson.feature(topo,topo.objects.land);
    const off=document.createElement('canvas'); off.width=W; off.height=H; const o=off.getContext('2d');
    o.beginPath(); d3.geoPath(proj,o)(land); o.fill();
    const data=o.getImageData(0,0,W,H).data;
    for(let y=3;y<H;y+=5) for(let x=3;x<W;x+=5) if(data[(y*W+x)*4+3]>128){
      ctx.fillStyle=`rgba(96,156,214,${.5+.25*Math.random()})`; ctx.beginPath(); ctx.arc(x,y,1.4,0,7); ctx.fill();
    }
  }).catch(()=>{ const m=document.createElement('div'); m.className='maperr'; m.textContent='지도 데이터를 불러오지 못했습니다 · 인터넷 연결을 확인하세요'; document.getElementById('map').appendChild(m); });

  // 위치 계산
  function at(frac){
    const t=frac*TOTAL; let lo=0, hi=pts.length-1;
    while(hi-lo>1){ const m=(lo+hi)>>1; (pts[m].d<=t?lo=m:hi=m); }
    const a=pts[lo], b=pts[hi], k=(t-a.d)/((b.d-a.d)||1);
    const ang=Math.atan2(b.xy[1]-a.xy[1], b.xy[0]-a.xy[0])*180/Math.PI;
    // 침로(진북 기준 방위각)
    const brg=(90-Math.atan2(b.ll[1]-a.ll[1], (b.ll[0]-a.ll[0])*Math.cos(a.ll[1]*Math.PI/180))*180/Math.PI+360)%360;
    return { i:lo, xy:[a.xy[0]+(b.xy[0]-a.xy[0])*k, a.xy[1]+(b.xy[1]-a.xy[1])*k],
             ll:[a.ll[0]+(b.ll[0]-a.ll[0])*k, a.ll[1]+(b.ll[1]-a.ll[1])*k], reg:a.reg, nm:t, ang, brg };
  }
  const dm=(v,pos,neg,w)=>{ const a=Math.abs(v), d=Math.floor(a), m=(a-d)*60; return `${v>=0?pos:neg} ${String(d).padStart(w,'0')}°${m.toFixed(1).padStart(4,'0')}'`; };
  const posStr=ll=>`${dm(ll[1],'N','S',2)} ${dm(ll[0],'E','W',3)}`;

  // 스탑워치
  const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
  let running=false, st=0, el=0, raf, reports=[], lastRep=0, prevV=1, prevNm=0, toastT;
  // reports: {type:'rep'|'port', ...}  — 위치 보고 + 자동 기항 이벤트
  const now=()=>running?el+performance.now()-st:el;
  const fmt=ms=>{ const h=Math.floor(ms/3600000), m=Math.floor(ms/60000)%60, s=Math.floor(ms/1000)%60, cs=Math.floor(ms/10)%100;
    return { main:(h?h+':':'')+pad(m)+':'+pad(s), cs:'.'+pad(cs) }; };

  function render(){
    const t=now(), frac=(t%VOY)/VOY, p=at(frac), f=fmt(t);
    $('time').innerHTML=f.main+'<small>'+f.cs+'</small>';
    trail.attr('d',line([...pts.slice(0,p.i+1).map(q=>q.xy),p.xy]));
    place(shipG,p.xy); hull.attr('transform',`rotate(${p.ang})`);
    const s=(performance.now()%1800)/1800; sonar.attr('r',6+s*16).attr('stroke-opacity',running?(1-s)*.8:0);
    PORTS.forEach(q=>{ const on=t>0&&p.nm>=q.d-1; q.tick.classList.toggle('on',on); q.dot.attr('fill',on?'#ffb547':'#081325'); });
    // 자동 기항 이벤트
    const v=Math.floor(t/VOY)+1;
    if(running){
      if(v!==prevV){ portEvent(PORTS[PORTS.length-1], t, prevV, true); pinG.selectAll('g').attr('opacity',.3); prevNm=0; }
      PORTS.slice(1,-1).forEach(q=>{ if(prevNm<q.d && p.nm>=q.d) portEvent(q, t, v, false); });
      prevV=v; prevNm=p.nm;
    }
    $('fill').style.width=(frac*100)+'%';
    $('sVoy').textContent='#'+(Math.floor(t/VOY)+1); $('sPct').textContent=Math.floor(frac*100)+'%';
    $('sDist').textContent=Math.round(p.nm).toLocaleString()+' nm';
    $('hReg').textContent=t?p.reg:'부산항 정박 중'; $('hPos').textContent=posStr(p.ll); $('hHdg').textContent=t?String(Math.round(p.brg)).padStart(3,'0')+'°':'—';
    return {p,t};
  }
  function loop(){ render(); raf=requestAnimationFrame(loop); }
  function ui(){
    const s=$('state'); s.className='state'+(running?' live':el?' hold':'');
    $('stateText').textContent=running?'항해 중':el?'정박 중':'출항 대기';
    const b=$('startBtn'); b.textContent=running?'정박':el?'재출항':'출항'; b.classList.toggle('hold',running);
    $('lapBtn').disabled=!running; $('resetBtn').disabled=running||!el;
  }
  const ANCHOR='<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="3.5" r="1.8"/><path d="M8 5.3V14M4.5 8h7M2.5 10c.8 2.6 3 4 5.5 4s4.7-1.4 5.5-4"/></svg>';
  function showToast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }
  function portEvent(q, t, v, arrival){
    reports.push({type:'port', t, reg:arrival?`${q.ko}항 입항 · 항차 #${v} 완료`:`${q.ko} 통과`, ll:q.ll});
    q.ring.interrupt().attr('r',7).attr('stroke-opacity',.9).transition().duration(1400).attr('r',22).attr('stroke-opacity',0)
      .transition().duration(0).attr('r',7).attr('stroke-opacity',.35);
    showToast(arrival?`⚓ ${q.ko}항 입항 — 항차 #${v} 완료, 다음 항해 출항`:`${q.ko} ${q.en} 통과`);
    drawLog();
  }
  function drawLog(){
    const reps=reports.filter(r=>r.type==='rep').length;
    $('logCount').textContent=`보고 ${reps} · 기항 ${reports.length-reps}`;
    if(!reports.length){ $('log').innerHTML='<li class="empty">항해 중 <b>위치 보고</b>를 누르면 현재 좌표가 기록됩니다<br>항구를 지나면 기항 기록이 자동으로 남습니다</li>'; return; }
    $('log').innerHTML=reports.map(r=>{ const tt=fmt(r.t);
      if(r.type==='port') return `<li class="port-ev"><span class="no">${ANCHOR}</span><div><div class="reg">${r.reg}</div><div class="pos mono">${posStr(r.ll)}</div></div>
              <div class="tm mono"><small>${tt.main}${tt.cs}</small></div></li>`;
      const s=fmt(r.seg);
      return `<li><span class="no mono">${r.n}</span><div><div class="reg">${r.reg}</div><div class="pos mono">${posStr(r.ll)}</div></div>
              <div class="tm mono">+${s.main}${s.cs}<small>${tt.main}${tt.cs}</small></div></li>`; }).reverse().join('');
  }
  function toggle(){ if(running){ el=now(); running=false; cancelAnimationFrame(raf); render(); } else { st=performance.now(); running=true; loop(); } ui(); }
  function report(){
    if(!running) return; const {p,t}=render();
    const n=reports.filter(r=>r.type==='rep').length+1;
    reports.push({type:'rep', n, t, seg:t-lastRep, reg:p.reg, ll:p.ll}); lastRep=t;
    const g=pinG.append('g').datum(p.xy); place(g,p.xy);
    g.append('circle').attr('r',8).attr('fill','#081325').attr('stroke','#ffb547').attr('stroke-width',1.4);
    g.append('text').attr('text-anchor','middle').attr('dy',3.5).attr('font-size',9).attr('font-weight',800).attr('fill','#ffb547').text(n);
    drawLog();
  }
  function reset(){ if(running) return; el=0; lastRep=0; reports=[]; prevV=1; prevNm=0; pinG.selectAll('*').remove(); render(); drawLog(); ui(); }
  $('startBtn').onclick=toggle; $('lapBtn').onclick=report; $('resetBtn').onclick=reset;
  document.addEventListener('keydown',e=>{ if(e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.code==='Space'){ e.preventDefault(); toggle(); } else if(e.code==='KeyP') report(); else if(e.code==='KeyR') reset(); });
  window.addEventListener('resize',()=>{
    calcK(); PORTS.forEach(p=>place(p.g,proj(p.ll))); pinG.selectAll('g').each(function(xy){ place(d3.select(this),xy); }); render();
  });
  render(); drawLog();
</script>
</body>
</html>
