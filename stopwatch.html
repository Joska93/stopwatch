<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --border: #e5e5ea;
    --start: #34c759;
    --stop: #ff3b30;
    --neutral: #d1d1d6;
    --best: #34c759;
    --worst: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
      --neutral: #3a3a3c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .display {
    font-size: clamp(56px, 18vw, 84px);
    font-weight: 200;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    margin: 24px 0 40px;
  }
  .display .ms { color: var(--muted); }
  .controls {
    display: flex;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  button {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: none;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    background: var(--neutral);
    transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(0.94); }
  button:disabled { opacity: .4; cursor: default; }
  button.start { background: var(--start); color: #fff; }
  button.stop  { background: var(--stop);  color: #fff; }
  .laps {
    list-style: none;
    border-top: 1px solid var(--border);
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
  }
  .laps li.best  { color: var(--best); }
  .laps li.worst { color: var(--worst); }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="display" id="display">00:00<span class="ms">.00</span></div>

  <div class="controls">
    <button id="lapBtn" disabled>랩</button>
    <button id="startBtn" class="start">시작</button>
  </div>

  <ul class="laps" id="laps"></ul>

  <p class="hint">Space: 시작/정지 · L: 랩 · R: 초기화</p>
</div>

<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() 기준 시작 시각
  let elapsed = 0;     // 정지 시점까지 누적된 시간(ms)
  let lastLapTotal = 0;
  let laps = [];       // 각 랩 구간 시간(ms)
  let rafId = null;

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const s = totalSec % 60;
    const totalMin = Math.floor(totalSec / 60);
    const m = totalMin % 60;
    const h = Math.floor(totalMin / 60);
    const pad = n => String(n).padStart(2, '0');
    const main = (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
    return { main, cs: '.' + pad(cs) };
  }

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function render() {
    const t = format(now());
    display.innerHTML = t.main + '<span class="ms">' + t.cs + '</span>';
    // 진행 중인 현재 랩 갱신
    const current = lapsEl.querySelector('li.current span:last-child');
    if (current) {
      const c = format(now() - lastLapTotal);
      current.textContent = c.main + c.cs;
    }
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    if (elapsed === 0 && !running) return;

    // 현재 진행 중인 랩
    const cur = document.createElement('li');
    cur.className = 'current';
    const c = format(now() - lastLapTotal);
    cur.innerHTML = `<span>랩 ${laps.length + 1}</span><span>${c.main}${c.cs}</span>`;
    lapsEl.appendChild(cur);

    let min = Infinity, max = -Infinity;
    if (laps.length >= 2) {
      min = Math.min(...laps);
      max = Math.max(...laps);
    }
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (laps[i] === min) li.className = 'best';
      else if (laps[i] === max) li.className = 'worst';
      const f = format(laps[i]);
      li.innerHTML = `<span>랩 ${i + 1}</span><span>${f.main}${f.cs}</span>`;
      lapsEl.appendChild(li);
    }
  }

  function updateButtons() {
    if (running) {
      startBtn.textContent = '정지';
      startBtn.className = 'stop';
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
    } else {
      startBtn.textContent = '시작';
      startBtn.className = 'start';
      lapBtn.textContent = elapsed > 0 ? '재설정' : '랩';
      lapBtn.disabled = elapsed === 0;
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(rafId);
      render();
    } else {
      startTime = performance.now();
      running = true;
      tick();
      if (lapsEl.children.length === 0) renderLaps();
    }
    updateButtons();
  }

  function lap() {
    if (!running) return;
    const total = now();
    laps.push(total - lastLapTotal);
    lastLapTotal = total;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    lastLapTotal = 0;
    laps = [];
    render();
    renderLaps();
    updateButtons();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });
</script>
</body>
</html>
